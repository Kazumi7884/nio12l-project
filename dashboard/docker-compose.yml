# Legacy NIO dashboard stack. Localhost-only by default; use a trusted tunnel/VPN.
# No service receives the host Docker socket.
services:
  caddy:
    image: caddy:2-alpine
    container_name: nio12l-caddy
    restart: unless-stopped
    ports:
      - "${NIO_DASHBOARD_BIND:-127.0.0.1}:80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homepage
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [nio12l-net]

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: nio12l-homepage
    restart: unless-stopped
    expose: ["3000"]
    volumes:
      - ./config:/app/config:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:-localhost,127.0.0.1,localhost:18080,127.0.0.1:18080}"
    security_opt:
      - no-new-privileges:true
    networks: [nio12l-net]

  netdata:
    image: netdata/netdata:latest
    container_name: nio12l-netdata
    restart: unless-stopped
    expose: ["19999"]
    volumes:
      - netdata_data:/var/lib/netdata
      - /etc/netdata:/etc/netdata:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /etc/os-release:/host/etc/os-release:ro
    security_opt:
      - no-new-privileges:true
    # No SYS_PTRACE or unconfined AppArmor. Some host-process metrics will be unavailable.
    networks: [nio12l-net]

networks:
  nio12l-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  netdata_data:
