# Netdata configuration for Radxa NIO 12L
# Based on defaults from github: netdata/netdata
# Custom sections for MediaTek Genio 1200 APU/NPU and Mali-G57 GPU

[global]
    run as user = netdata
    web files owner = root
    web group = root
    # Bind to all interfaces for remote dashboard access
    bind socket to = *
    default port = 19999
    directory listing = no
    # Enable all database engines
    memory mode = dbengine
    # 1-hour history at 1s resolution (lightweight for 4-16GB RAM)
    history = 3600
    # Update every 2 seconds for real-time feel
    update every = 2

[plugins]
    # Enable python.d for custom NPU/GPU collectors
    python.d = yes
    charts.d = yes
    ioping = no
    cgroups = yes
    tc = yes
    sensors = yes
    freeipmi = no
    nfs = yes
    proc = yes
    apps = yes

# ── MediaTek APU/NPU Custom Collector ───────────────────────────────────────
[plugin:python.d]
    # Load the NPU/GPU metrics collector
    command = python3 -u /usr/lib/netdata/python.d/npu_gpu.py
    allow running from netdata = true

    [plugin:python.d:npu_gpu]
    name = npu_gpu
    enabled = yes
    # Run every 2 seconds for real-time NPU metrics
    update_every = 2

# ── System collectors ────────────────────────────────────────────────────────
[plugin:proc]
    # Monitor CPU throttling (important for ARM thermal throttling)
    /proc/pressure/cpu = yes
    /proc/pressure/memory = yes
    /proc/pressure/io = yes

[plugin:cgroups]
    # Monitor container resource usage
    cgroups = +docker +lxc +systemd

# ── Thermal sensors ──────────────────────────────────────────────────────────
[plugin:sensors]
    # MediaTek thermal zones
    path = /sys/class/thermal
    enabled = yes

# ── Disk space alerts ────────────────────────────────────────────────────────
[plugin:freeipmi]
    enabled = no  # Not available on ARM

# ── Alarms ────────────────────────────────────────────────────────────────────
[alarm-config]
    enabled = yes

    # Alert: high CPU temperature
    [temp]
    lookup = average
    units = celsius
    every = 30s
    warn = $this > 75
    crit = $this > 85
    exec = /usr/local/bin/nio12l-alert.sh cpu-temp $this

    # Alert: low disk space
    [disk_space]
    lookup = average
    units = percent
    every = 1m
    warn = $this < 10
    crit = $this < 5
    exec = /usr/local/bin/nio12l-alert.sh low-disk $this

    # Alert: NPU not available
    [npu_down]
    lookup = average
    units = status
    every = 30s
    warn = $this == 0
    crit = $this == 0
    exec = /usr/local/bin/nio12l-alert.sh npu-down $this

    # Alert: low swap
    [swap_usage]
    lookup = average
    units = percent
    every = 1m
    warn = $this > 80
    crit = $this > 95
