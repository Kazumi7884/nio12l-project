# Netdata Custom Dashboard Configuration for NIO 12L
# github.com/netdata/netdata
#
# Creates custom dashboard views focused on NPU and GPU metrics
# on the Radxa NIO 12L (MediaTek Genio 1200).
#
# Place in: /etc/netdata/dashboard_info.conf
# Or use Netdata's UI to create custom dashboards.
#
# After applying, restart: systemctl restart netdata

[global]
    # Use the "slate" theme for dark mode visibility
    default theme = slate
    # Show all charts by default
    default chart type = line
    # Refresh every second for AI workload monitoring
    default refresh = 1

# ── Custom Charts for MediaTek APU/NPU ──────────────────────────────────────
# Uses the custom npu_gpu.py collector defined in dashboard/config/netdata/

[charts:npus]
    title = NPU (APU) Utilization
    type = utilization
    units = %
    family = npu
    update every = 2
    chart type = line
    dimensions = npu_util_0, npu_util_1
    line1 = npu_util_0 "NPU 0 Util"
    line2 = npu_util_1 "NPU 1 Util"

[charts:gpus]
    title = GPU Utilization & Frequency
    type = utilization
    units = % / MHz
    family = gpu
    update every = 2
    chart type = line
    dimensions = gpu_util, gpu_freq
    line1 = gpu_util "GPU Utilization"
    line2 = gpu_freq "GPU Frequency"

[charts:vpu]
    title = Video Processing Unit Load
    type = utilization
    units = %
    family = vpu
    update every = 2
    chart type = line
    dimensions = vpu_util
    line1 = vpu_util "VPU Load"

# ── Alarms ──────────────────────────────────────────────────────────────────
# NPU not detected
alarm: npu_down
    on = npu.npu_util
    lookup = average
    units = status
    every = 30s
    warn = $this == 0
    crit = $this == 0
    exec = /usr/local/bin/nio12l-alert.sh npu-down $this

# GPU throttling / stuck at low frequency
alarm: gpu_thermal_throttle
    on = sensors.temperatures
    lookup = average
    units = celsius
    every = 30s
    warn = $this > 75
    crit = $this > 85
    exec = /usr/local/bin/nio12l-alert.sh gpu-temp $this

# NPU temperature (if available)
alarm: npu_overheat
    on = npu.npu_util
    lookup = average
    units = celsius
    every = 30s
    warn = $this > 70
    crit = $this > 80
    exec = /usr/local/bin/nio12l-alert.sh npu-temp $this
